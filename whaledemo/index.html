<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<!-- Apple Touch Icon for iOS devices -->
<link rel="apple-touch-icon" href="assets/favicon.png">

<!-- Android Chrome -->
<link rel="icon" sizes="192x192" href="assets/favicon.png">

<style>
    body {
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: black;
        color: white; /* Set text color to white for better visibility */
        font-family: 'Roboto', sans-serif;
    }
    .container {
        position: relative;
        width: 100%;
        max-width: 1200px; /* Set a maximum width for the iframe */
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    iframe {
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
    }
    .tracker {
        position: absolute;
        top: 50%;
        left: 50%;
        width: auto;
        height: 70%;
        transform: translate(-50%, -50%);
        object-fit:  ;
    }
    .helper-text {
        margin-top: 20px;
        text-align: center;
        max-width: 1000px;
        font-size: 22px;
    }
    .toggle-button {
        margin-top: 20px;
        padding: 15px 30px;
        font-size: 24px;
        cursor: pointer;
        font-family: 'Roboto', sans-serif;
    }
</style>
</head>

<body>
    <div class="container">
        <iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/Sjb2uyMoSA8?si=haHj4Bw3h256RTLL&controls=0&start=11&mute=1&autoplay=1" title="YouTube video player" frameborder="0" allow="autoplay; encrypted-media;" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><!-- embed tracker.jpg -->
        <img src="tracker.jpg" alt="tracker" class="tracker" id="trackerImage">
    </div>

    <button class="toggle-button" onclick="toggleTracker()">Toggle Tracker</button>

    <div class="helper-text">
        <p>To experience the augmented reality content, please scan the image above.</p>
        <p>Feel free to toggle the tracking image with the button.</p>
    </div>

    <script>
        function toggleTracker() {
            const trackerImage = document.getElementById('trackerImage');
            if (trackerImage.style.display === 'none') {
                trackerImage.style.display = 'block';
            } else {
                trackerImage.style.display = 'none';
            }
        }
    </script>
</body>

</html>
